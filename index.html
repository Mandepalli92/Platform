<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Microsoft 365 Assistant</title>
<style>
:root{--bg:#fafaf9;--p:#fff;--ink:#1c1b19;--m:#6b6862;--l:#e4e1db;--a:#3b5bdb;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#151514;--p:#1d1d1b;--ink:#ecebe8;--m:#9a978f;--l:#2e2d2a;--a:#7c93f5}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--l);background:var(--p)}
header b{flex:1}button,input{font:inherit;color:inherit}
button{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:8px 12px;cursor:pointer}
#feed{flex:1;overflow:auto;padding:16px}.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.me{align-self:flex-end;background:var(--a);color:#fff;padding:8px 14px;border-radius:14px;white-space:pre-wrap}
.ai,.err{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.err{border-color:#b42318}.src{display:block;font-size:12px;color:var(--m);margin-top:6px}.src a{color:var(--a)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--l);background:var(--p)}
input{flex:1;border:1px solid var(--l);background:var(--bg);border-radius:10px;padding:10px 12px}
</style></head><body>
<header><b>My Microsoft 365 Assistant</b><span id="who"></span><button id="login">Sign in</button><button id="logout" hidden>Sign out</button></header>
<div id="feed"><div class="col" id="col"></div></div>
<form id="f"><input id="in" placeholder="Ask about your mail, files or calendar…" autocomplete="off"><button id="send">Ask</button></form>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
